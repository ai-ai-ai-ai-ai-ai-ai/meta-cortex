[package]
name = "meta-cortex"
version = "0.1.3"
edition = "2024"
description = "Install the Meta-Cortex development framework in a project"
license = "Apache-2.0"
repository = "https://github.com/ai-ai-ai-ai-ai-ai-ai/meta-cortex"
homepage = "https://github.com/ai-ai-ai-ai-ai-ai-ai/meta-cortex"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
thiserror = "2.0.20"
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
dialoguer = { version = "0.12.0", default-features = false }
derive_more = { version = "2.1.1", features = ["from", "display"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
absolute_paths = "deny"

[package.metadata.dist]
dist = true

[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
rexpect = "0.7.1"
