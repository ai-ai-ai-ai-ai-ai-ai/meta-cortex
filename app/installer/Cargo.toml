[package]
name = "meta-cortex"
version.workspace = true
edition.workspace = true
description = "Install the Meta-Cortex development framework in a project"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
meta-cortex-workbench = { path = "../workbench" }
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
thiserror.workspace = true
tempfile.workspace = true
serde.workspace = true
toml = "1.1.6"
dialoguer = { version = "0.12.0", default-features = false }
derive_more.workspace = true
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize", "serialize"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
pulldown-cmark-to-cmark = "22.0.1"
tokio.workspace = true
schemars.workspace = true

[lints]
workspace = true

[package.metadata.dist]
dist = true

[dev-dependencies]
anyhow.workspace = true
rexpect = "0.7.1"
serde_json = "1.0.151"
