[workspace]
members = ["installer", "workbench"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ai-ai-ai-ai-ai-ai-ai/meta-cortex"
homepage = "https://github.com/ai-ai-ai-ai-ai-ai-ai/meta-cortex"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from", "display"] }
include_dir = "0.7.4"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "unstable-sha256"] }
meta-cortex-workbench = { path = "workbench" }
pulldown-cmark = { version = "0.13.4", default-features = false }
pulldown-cmark-to-cmark = "22.0.1"
schemars = "1.2.2"
sea-query = { version = "1.0.2", default-features = false, features = ["backend-sqlite", "derive", "thread-safe"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "time"] }
toml = "1.1.6"
turso = { version = "=0.8.0-pre.12", default-features = false }

[workspace.lints.rust]
warnings = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
absolute_paths = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
return_self_not_must_use = "deny"
result_unit_err = "deny"
wildcard_enum_match_arm = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"

[profile.dist]
inherits = "release"
lto = "thin"
