[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
windows-archive = ".zip"
install-path = "CARGO_HOME"
install-updater = false
tap = "ai-ai-ai-ai-ai-ai-ai/homebrew-tap"
publish-jobs = []
pr-run-mode = "upload"
cache-builds = true

# Release workflow runs dist from app/; retain its directory adjustments.
allow-dirty = ["ci"]
include = ["../LICENSE", "../README.md"]

# Native Linux builds link the Tauri desktop runtime against system WebKitGTK.
[dist.dependencies.apt]
"libwebkit2gtk-4.1-dev" = "*"
build-essential = "*"
libxdo-dev = "*"
libssl-dev = "*"
libayatana-appindicator3-dev = "*"
librsvg2-dev = "*"
