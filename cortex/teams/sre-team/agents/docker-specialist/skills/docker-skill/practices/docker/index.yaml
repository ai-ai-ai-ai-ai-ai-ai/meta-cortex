kind: practice
owner: sre:docker
title: Docker container and BuildKit practice
source_title: Docker container and BuildKit practice
source: ../docker-container-harness.md
owns:
  - build inputs, revision metadata placement, BuildKit cache evidence, and build-secret
    boundaries.
excludes:
  - project execution commands, credential lifecycle, or Kubernetes workload execution.
relationships: []
related:
  - title: Project execution policy
    path: ../../../../../../docs/project-execution-policy.md
  - title: operations circuit breaker
    path: ../../../../../../CIRCUIT-BREAKER.md
  - title: secret lifecycle
    path: ../../../../../../../security-team/docs/secret-lifecycle.md
rules:
  - id: docker:input_isolation
    source: ../docker-container-harness.md#isolate-build-inputs
    items:
      - Give each stage only inputs that can affect its output, including test and
        packaging stages.
      - Adapt illustrative manifests and commands to the project's build contract.
  - id: docker:late_revision_identity
    source: ../docker-container-harness.md#introduce-build-identity-at-its-consumer
    items:
      - Introduce revision, release, or provenance identity at the latest boundary that
        consumes it.
  - id: docker:buildkit_authority
    source: ../docker-container-harness.md#let-buildkit-own-cache-validity
    items:
      - Let BuildKit decide cache validity and reuse using genuine cache imports and
        exports.
      - Do not add custom fingerprints, selectors, allowlists, or cache-hit simulations.
  - id: docker:real_cache_evidence
    source: ../docker-container-harness.md#prove-cold-warm-import-and-export-builds
    items:
      - Verify cache changes with real cold, warm, clean import, and export solves.
      - Record commands, results, cache output, and readable exported artifacts;
        successful exit status alone does not prove reuse or portability.
  - id: docker:secret_boundary
    source: ../docker-container-harness.md#keep-secrets-out-of-build-inputs
    items:
      - Keep secrets out of ordinary build inputs, arguments, environment, layers,
        metadata, and logs.
      - Use a narrow BuildKit secret mount when a build requires a secret; do not
        persist its value.
  - id: docker:validation
    source: ../docker-container-harness.md#validation
    items:
      - Review stage input/output boundaries, run project Dockerfile or BuildKit checks,
        and inspect cache artifacts and diagnostic surfaces.
