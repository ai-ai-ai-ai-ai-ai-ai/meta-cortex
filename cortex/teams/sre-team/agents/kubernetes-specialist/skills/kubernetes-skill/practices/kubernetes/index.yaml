kind: practice
owner: sre:kubernetes
title: Kubernetes runtime boundary
source_title: Kubernetes runtime boundary
source: ../kubernetes-runtime-boundary.md
owns:
  - workload execution, nested runtimes, runtime sockets, and build-service boundaries.
excludes:
  - provider selection, the project's complete security posture, or build-cache design.
relationships: []
related:
  - title: Cloud-native operations
    path: ../../../cloud-native-skill/practices/cloud-native-operations.md
  - title: project execution policy
    path: ../../../../../../docs/project-execution-policy.md
rules:
  - id: kubernetes:no_nested_runtime
    source: ../kubernetes-runtime-boundary.md#keep-container-execution-inside-the-pod-contract
    items:
      - Do not start nested runtimes or manage sibling containers from a workload.
  - id: kubernetes:direct_execution
    source: ../kubernetes-runtime-boundary.md#keep-container-execution-inside-the-pod-contract
    items:
      - Use the project's selected Pod or Job image containing the runtime and tools
        needed to execute the workload directly.
  - id: kubernetes:no_runtime_socket
    source: ../kubernetes-runtime-boundary.md#reject-runtime-sockets-host-paths-and-privilege
    items:
      - Do not mount host runtime sockets or use host paths or privilege to recreate a
        runtime.
      - Other host integrations require the project's explicit contract and security
        review.
  - id: kubernetes:build_execution_separation
    source: ../kubernetes-runtime-boundary.md#keep-build-services-as-build-services
    items:
      - Call an explicitly provided build/export service only when the project allows it.
      - Build access does not authorize daemon runtime commands; execute the result as
        an ordinary workload.
  - id: kubernetes:validation
    source: ../kubernetes-runtime-boundary.md#validate-the-execution-boundary
    items:
      - Inspect rendered manifests and scripts for commands, mounts, host paths, and
        security contexts.
      - Run available schema or server-side dry-run checks and report them separately
        from behavior tests.
