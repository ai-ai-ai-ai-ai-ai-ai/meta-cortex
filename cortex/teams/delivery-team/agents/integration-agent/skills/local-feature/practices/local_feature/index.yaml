rules:
  - id: local_feature:workspace
    source: ../../SKILL.md#team-architecture
    summary: Give each writer an isolated task branch and worktree.
  - id: local_feature:completion
    source: ../../SKILL.md#team-architecture
    summary: Workers validate, commit, and return results and issues to Gizmo.
  - id: local_feature:integration
    source: ../../SKILL.md#team-architecture
    summary: Gizmo owns shared integration; its owner validates the combined feature.
  - id: local_feature:repair
    source: ../../SKILL.md#team-architecture
    summary: Gizmo evaluates results and revises assignments or requests further work.
  - id: local_feature:cleanup
    source: ../../SKILL.md#team-architecture
    summary: Preserve user workspaces and recovery state; clean only finished agent workspaces.
  - id: local_feature:judgment
    source: ../../SKILL.md#team-architecture
    summary: Agents choose Git mechanics within project constraints; Prime owns acceptance.
