kind: practice
owner: rust:code_separation
title: Rust–TypeScript separation
source_title: Rust–TypeScript separation
source: ../rust-typescript-code-separation.md
owns:
  - Rust policy, browser presentation, and bridges.
excludes:
  - ABI representation and reactive integration.
relationships: []
related:
  - title: WASM contracts
    path: ../wasm-contracts.md
  - title: WASM UI integration
