kind: practice
title: Branching and exhaustive matching
source_title: Branching and exhaustive matching
source: ../../../../../../../docs/programming/branching-and-exhaustive-matching.md
owns:
  - Language-independent branching policy and exhaustive domain decisions.
excludes:
  - Language syntax, examples, and enforcement belong to the language practices.
relationships: []
related:
  - title: Domain states
    path: ../../modeling/domain-states.md
  - title: Rust code checks
    path: ../../tooling/rust-code-checks.md
rules:
  - id: branching:no_boolean_if
    source: ../../../../../../../docs/programming/branching-and-exhaustive-matching.md#use-patterns-instead-of-boolean-if-conditions
    items:
      - Match named domain alternatives directly; prohibit ordinary boolean conditions
        throughout authored code, including guards, validation, tests, and tooling.
      - Convert required raw inputs and dependency predicates at their boundary; name
        boolean outcomes before choosing workflow actions.
      - Keep conversions on existing owners without decorative branching abstractions.
      - Prefer native patterns; use library matchers only when native constructs cannot
        clearly express the pattern. Preserve exhaustiveness during migration.
  - id: branching:no_ternary
    source: ../../../../../../../docs/programming/branching-and-exhaustive-matching.md#do-not-use-ternary-conditionals
    items:
      - Prohibit ternary conditional operators where available; use explicit patterns.
  - id: branching:closed_matches
    source: ../../../../../../../docs/programming/branching-and-exhaustive-matching.md#close-every-domain-match
    items:
      - Name every variant in closed domain decisions and reject fallbacks that silently
        absorb future variants; check exhaustiveness statically.
      - Group named alternatives only when they share behavior.
      - Distinguish full decisions from focused payload extraction and open-input
        matching.
  - id: branching:validation
    source: ../../../../../../../docs/programming/branching-and-exhaustive-matching.md#validation
    items:
      - Verify that adding a variant fails incomplete decisions under required static
        checks.
      - Review focused patterns, unmatched handling, and boundary conversions.
      - Test variants separately when outcomes or payloads differ.
