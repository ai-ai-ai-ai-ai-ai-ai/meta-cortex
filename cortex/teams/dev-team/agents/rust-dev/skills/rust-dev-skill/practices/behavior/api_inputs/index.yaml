kind: practice
title: API inputs
source_title: API inputs
source: ../api-inputs.md
owns:
  - One non-receiver argument, semantic request types, and externally fixed signatures.
excludes:
  - Request construction belongs to Struct construction; method placement belongs to
    Function ownership.
relationships: []
related:
  - title: Struct construction
    path: ../../modeling/struct-construction.md
  - title: Function ownership
    path: ../function-ownership.md
rules:
  - id: api_inputs:one_input
    source: ../api-inputs.md#one-non-receiver-input
    items:
      - Limit authored functions/methods/command handlers to one non-receiver input.
      - Self, &self, and &mut self do not count.
  - id: api_inputs:semantic_requests
    source: ../api-inputs.md#required-actions
    items:
      - Use a semantic domain/operation request for independent inputs.
      - Pass an existing scalar newtype directly instead of wrapping one input without
        meaning.
  - id: api_inputs:command_decoding
    source: ../api-inputs.md#required-actions
    items:
      - Destructure or match the request inside the owning operation.
      - Parse CLI input at the edge into one typed command.
  - id: api_inputs:no_positional_bags
    source: ../api-inputs.md#prohibited-actions
    items:
      - Do not hide independent inputs in tuples/arrays/collections, generic
        Args/Params/Input/Options names, booleans, sentinels, or cross-workflow
        optionals.
  - id: api_inputs:external_signatures
    source: ../api-inputs.md#fixed-signature-exceptions
    items:
      - Externally fixed trait/FFI/generated ABI/framework signatures may retain their
        required inputs only on the adapter.
      - Identify the contract and delegate with one named typed request.
  - id: api_inputs:validation
    source: ../api-inputs.md#validation
    items:
      - Review non-receiver counts, semantic request construction, and the exact
        external justification for each retained multi-input signature.
