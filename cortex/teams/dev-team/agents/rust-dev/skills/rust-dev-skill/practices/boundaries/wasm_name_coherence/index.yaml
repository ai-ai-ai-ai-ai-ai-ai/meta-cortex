kind: practice
owner: rust:wasm_name_coherence
title: WASM and command name coherence
source_title: WASM name coherence
source: ../rust-wasm-name-coherence.md
owns:
  - Canonical symbols and external naming exceptions.
excludes:
  - Value representations and decoding mechanics.
relationships: []
related:
  - title: Domain types
    path: ../../modeling/domain-types.md
  - title: Serialization boundaries
    path: ../serialization-boundaries.md
rules:
  - id: wasm_name_coherence:same_names
    source: ../rust-wasm-name-coherence.md#preserve-imported-and-exported-names
    summary: Preserve names across project-owned language boundaries.
  - id: wasm_name_coherence:no_aliases
    source: ../rust-wasm-name-coherence.md#preserve-imported-and-exported-names
    summary: Avoid aliases that rename generated contracts.
  - id: wasm_name_coherence:export_names
    source: ../rust-wasm-name-coherence.md#preserve-method-and-property-names
    summary: Export Rust symbols under their canonical names.
  - id: wasm_name_coherence:serialization_names
    source: ../rust-wasm-name-coherence.md#preserve-fields-and-enum-variants
    summary: Preserve project-owned schema names during serialization.
  - id: wasm_name_coherence:command_names
    source: ../rust-wasm-name-coherence.md#preserve-command-identities
    summary: Use Rust variants directly as command identities.
  - id: wasm_name_coherence:command_groups
    source: ../rust-wasm-name-coherence.md#group-operations-by-their-owning-domain
    summary: Preserve typed operation groups through dispatch and transport.
  - id: wasm_name_coherence:external_names
    source: ../rust-wasm-name-coherence.md#map-fixed-external-names-only-at-the-adapter
    summary: Isolate required external naming in boundary adapters.
  - id: wasm_name_coherence:migrations
    source: ../rust-wasm-name-coherence.md#map-fixed-external-names-only-at-the-adapter
    summary: Change established wire names only through authorized migrations.
  - id: wasm_name_coherence:validation
    source: ../rust-wasm-name-coherence.md#validation
    summary: Check naming exceptions, generated bindings, and migrations.
