kind: practice
title: Default values
source_title: Default values
source: ../default-values.md
owns:
  - Meaningful struct defaults and enum default variants.
excludes:
  - General construction syntax belongs to Struct construction; absence modeling belongs
    to Domain states.
relationships: []
related:
  - title: Struct construction
    path: ../struct-construction.md
  - title: Domain states
    path: ../domain-states.md
rules:
  - id: default_values:valid_defaults
    source: ../default-values.md#choose-a-valid-default
    items:
      - Provide Default only for a meaningful valid starting value.
      - Never invent defaults for required or validated input.
  - id: default_values:struct_defaults
    source: ../default-values.md#structs-derive-field-defaults
    items:
      - Derive Default when field defaults match the type semantics.
      - Use a manual implementation only for genuinely different defaults.
  - id: default_values:enum_defaults
    source: ../default-values.md#enums-mark-the-default-variant
    items:
      - Use `#[default]` on the intended unit enum variant.
      - Implement Default manually when the default variant carries data.
