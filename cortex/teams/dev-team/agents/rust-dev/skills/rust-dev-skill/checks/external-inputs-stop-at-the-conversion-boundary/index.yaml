kind: check
title: External inputs stop at the conversion boundary
overview:
  - Check the destination type and its stored fields after converting a dependency-owned
    value.
prohibited:
  - "`From<bool>` produces an application struct that still stores the raw flag."
preferred:
  - "`From<bool>` produces a domain enum; converting an external record converts each
    field into its owned domain type."
