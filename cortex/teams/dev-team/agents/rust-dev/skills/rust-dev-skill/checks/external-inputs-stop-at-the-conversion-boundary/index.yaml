    source: ../../practices/modeling/domain-types.md#external-raw-values
  - id: domain_states:boolean_conversion
    source: ../../practices/modeling/domain-states.md#convert-external-records-into-owned-types
  - id: domain_states:external_records
    source: ../../practices/modeling/domain-states.md#convert-external-records-into-owned-types
