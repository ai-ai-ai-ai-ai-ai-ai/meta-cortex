kind: check
title: UI state does not transfer WASM ownership
overview:
  - Check allocation ownership when a component retains, replaces, or releases a WASM
    value.
prohibited:
  - Clone a WASM class through JSON for reactive state, or free an object merely because
    a borrowing component unmounted.
preferred:
  - Retain the declared value and let its allocation owner perform replacement and
    cleanup; framework refs do not create ownership.
compare:
