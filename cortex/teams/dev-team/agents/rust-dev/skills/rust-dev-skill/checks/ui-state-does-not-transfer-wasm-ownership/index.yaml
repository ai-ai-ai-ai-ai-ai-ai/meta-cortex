kind: check
title: UI state does not transfer WASM ownership
overview:
  - Check allocation ownership during UI replacement and cleanup.
prohibited:
  - Free borrowed objects or JSON-clone WASM instances.
preferred:
  - Preserve instances and leave cleanup with their owner.
