    source: ../../practices/modeling/domain-states.md#require-values-that-cannot-be-absent
  - id: domain_states:drafts
    source: ../../practices/modeling/domain-states.md#require-values-that-cannot-be-absent
  - id: error_handling:required_input
    source: ../../practices/behavior/error-handling.md#required-actions
