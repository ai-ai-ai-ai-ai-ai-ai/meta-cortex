kind: check
title: One parameter still needs a named argument
overview:
  - Check the parameter declaration and the object supplied at each call site.
prohibited:
  - Replace positional inputs with an anonymous object parameter or pass an unbound
    object literal to an ordinary method.
preferred:
  - Declare a named request type, bind the object to an explicitly typed name, and pass
    that binding. Keep rune exceptions limited to the listed compiler forms.
compare:
  - id: single_parameter:semantic_request
    source: ../../practices/typescript-single-parameter.md#collect-independent-inputs-in-one-request
  - id: named_args:typed_bindings
    source: ../../practices/typescript-named-args.md#name-and-type-object-arguments
  - id: named_args:rune_exceptions
    source: ../../practices/typescript-named-args.md#limit-rune-exceptions-to-the-compiler-forms
