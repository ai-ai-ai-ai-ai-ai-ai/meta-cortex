kind: check
title: Queue continuation must preserve completion and cleanup
overview:
  - Trace each admitted job through success, failure, recovery, and scope shutdown.
prohibited:
  - Catch and discard a job failure to keep the worker alive, leave its completion
    unresolved, or assume queue shutdown settles every admitted job.
preferred:
  - Complete each job with its typed outcome while allowing later work to run. Settle
    admitted work during shutdown; keep host-required Promise conversion at the adapter.
compare:
  - id: serial_operation_queues:typed_completion
    source: ../../practices/typescript-serial-operation-queues.md#report-failure-without-stopping-later-work
  - id: serial_operation_queues:admission_and_shutdown
    source: ../../practices/typescript-serial-operation-queues.md#report-failure-without-stopping-later-work
  - id: effect:upstream
    source: ../../SKILL.md#effect-use-installed-documentation
