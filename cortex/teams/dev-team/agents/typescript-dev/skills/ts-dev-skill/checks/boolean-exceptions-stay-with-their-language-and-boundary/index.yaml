kind: check
title: Boolean exceptions stay with their language and boundary
overview:
  - Check the owner of an unavoidable boolean contract and the precise exception in the
    applicable language practice.
prohibited:
  - Treat a host signature or dependency predicate as permission for authored boolean
    decisions in either language.
preferred:
  - Normalize required external booleans into named domain outcomes before workflow
    behavior. Keep conversions on their TypeScript or Rust owner.
