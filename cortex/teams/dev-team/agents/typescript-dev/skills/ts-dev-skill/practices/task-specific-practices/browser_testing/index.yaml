kind: practice
owner: typescript:browser_testing
title: Browser testing
source_title: Browser testing
source: ../../browser-testing.md
owns:
  - Observable browser integration, regression coverage, and failure investigation.
excludes:
  - Browser implementation choices belong to Browser implementation; dead-code checks
    belong to Unused code.
relationships: []
related:
  - title: Browser implementation
    path: ../../browser-implementation.md
  - title: Unused code
    path: ../../web-unused-code.md
rules:
  - id: browser_testing:browser_boundary
    source: ../../browser-testing.md#test-the-boundary-that-can-fail
    items:
      - Use the project’s browser tooling for observable user/browser/extension
        integration, persistence, visibility, clipboard/download/multitab/origin
        behavior.
      - Test portable algorithms in their Rust or TypeScript domain owner.
  - id: browser_testing:suite_gates
    source: ../../browser-testing.md#validation
    items:
      - When specs are partitioned across projects, every non-demo behavior spec appears
        exactly once in the executable gate manifest.
      - Default discovery does not need a redundant manifest.
  - id: browser_testing:diagnose_first
    source: ../../browser-testing.md#repair-from-evidence-with-a-regression-first
    items:
      - Before fixing an E2E failure, inspect saved output/logs/context/trace, identify
        the owning boundary, and choose the smallest existing regression framework.
  - id: browser_testing:regression_first
    source: ../../browser-testing.md#repair-from-evidence-with-a-regression-first
    items:
      - Follow common regression-before-fix procedure with actual transport contracts
        and realistic mocks.
      - Make the smallest owning correction and retain regressions.
  - id: browser_testing:retain_acceptance
    source: ../../browser-testing.md#repair-from-evidence-with-a-regression-first
    items:
      - Keep browser assertions for acceptance, including browser-only defects with
        their closest deterministic unit contract.
      - Diagnose new failure evidence before each subsequent repair.
  - id: browser_testing:no_weakened_tests
    source: ../../browser-testing.md#do-not-weaken-the-failing-scenario
    items:
      - Do not fix failures by weakening assertions, extending timeouts, skipping
        scenarios, or inventing a new framework when an existing one covers the
        behavior.
  - id: browser_testing:evidence
    source: ../../browser-testing.md#validation
    items:
      - Measure meaningful contracts/branches rather than test count.
      - Record changed-flow browser results and ensure every behavior spec has an
        executable gate.
