kind: practice
title: Concrete values
source_title: Concrete values
source: ../../typescript-no-unknown.md
owns:
  - Restrictions on object, unknown, any, and erased bags; immediate boundary decoding.
excludes:
  - Named domain contracts belong to Domain structure; effectful decoding belongs to
    upstream Effect guidance.
relationships: []
related:
  - title: Domain structure
    path: ../../typescript-domain-structure.md
  - title: Upstream Effect guidance
    path: ../../../SKILL.md#effect-use-installed-documentation
rules:
  - id: no_unknown:no_object
    source: ../../typescript-no-unknown.md#do-not-erase-application-contracts
    items:
      - Prohibit object everywhere in authored TypeScript/Svelte/tooling, with no
        boundary exception.
      - Exclude generated declarations.
  - id: no_unknown:unknown_boundary
    source: ../../typescript-no-unknown.md#decode-unknown-only-at-an-unavoidable-edge
    items:
      - Allow unknown only at an unavoidable untyped external transport decoder that
        immediately validates into a concrete domain value or typed failure.
  - id: no_unknown:concrete_inputs
    source: ../../typescript-no-unknown.md#decode-unknown-only-at-an-unavoidable-edge
    items:
      - Use a concrete platform input type when available.
      - Never make generic-value APIs a preferred or copied application pattern.
  - id: no_unknown:no_erased_substitutes
    source: ../../typescript-no-unknown.md#do-not-erase-application-contracts
    items:
      - Do not substitute Object, {}, any, broad indexes, Record<string,...>, recursive
        JsonValue/ExternalValue bags, or generic promise results.
  - id: no_unknown:decoder_scope
    source: ../../typescript-no-unknown.md#decode-unknown-only-at-an-unavoidable-edge
    items:
      - Keep unknown values only between adjacent steps of a dedicated contiguous
        decoding pipeline.
      - Do not store them or pass them into commands/services/UI/domain state.
  - id: no_unknown:catch_bindings
    source: ../../typescript-no-unknown.md#keep-failures-concrete
    items:
      - Keep catch bindings unannotated or concrete.
      - "Do not write catch(error: unknown)."
      - Keep casts at the host boundary.
  - id: no_unknown:typed_errors
    source: ../../typescript-no-unknown.md#keep-failures-concrete
    items:
      - Use Effect typed errors for effectful work and concrete codec-local outcomes for
        decoding.
  - id: no_unknown:enforcement
    source: ../../typescript-no-unknown.md#validation
    items:
      - Enforce restricted types through ESLint.
      - Audit boundary unknown exceptions for immediate narrowing and reject
        generic-value escapes.
