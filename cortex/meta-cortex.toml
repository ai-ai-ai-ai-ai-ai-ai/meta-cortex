# Execution settings for Meta-Cortex agents.
# Settings apply by role, regardless of agent directory.
# Speed comes from the host session; select Fast in the host before launching agents.
# Host launch and verification: teams/gizmo-team/docs/agent-configuration.md

# Required host capacity, including the primary agent and all coordinators.
# This target does not change the host's active allocation.
[host]
required_total_agents = 20

[gizmo-prime]
model = "gpt-6-astra"
reasoning_effort = "low"

[team.gizmo]
model = "gpt-6-astra"
reasoning_effort = "low"

[team.agent]
model = "gpt-6-astra"
reasoning_effort = "low"
