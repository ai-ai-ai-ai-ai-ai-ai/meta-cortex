fields:
  - name: development.mode
    question: "Development mode: single_agent uses this agent and thread; multi_agent runs the Gizmo team. Which mode?"
    options:
      - single_agent
      - multi_agent
  - name: development.delivery
    question: "Delivery: create_pr (recommended) commits and pushes the validated feature and creates or updates its PR; local_only keeps work local without pushing or creating a PR. Which delivery?"
    options:
      - create_pr
      - local_only
