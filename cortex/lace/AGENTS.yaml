stages:
  overview:
    spec:
      contextLanguage: Neural Lace defines the typed declaration language for Cortex context.
      contextSubjects:
        Context includes architecture, specifications, rules, agent
        instructions, skills, and practices.
      readAsText: Agents read declarations as text, just as they read Markdown.
      entryPointReading: Read this entry point as context; do not load it to execute commands.
      authoringOwner: Context Engineering owns receipt authoring.
      markdownAuthority: Other existing Cortex Markdown instructions remain authoritative.
    Required:
      statements: {}
    Prohibited:
      statements: {}
  orientation:
    spec: {}
    Required:
      statements:
        followContract:
          Follow the core ownership, receipt contract, and validation
          context below.
        resolvePaths:
          "Resolve prose paths in this entry point from the Cortex library
          root: cortex/ in this repository or .meta-cortex/ in an installed
          project."
    Prohibited:
      statements: {}
  coreOwnershipVocabulary:
    spec:
      readModel: Read lace/src/ts/lace.ts before authoring receipts.
      modelVocabulary:
        The model contains the WorkingDirectory enum and readonly Job,
        Stage, Statement, Required, Prohibited, and ShellCommand contracts.
      readonlyJobs:
        Job is a readonly interface; receipts use plain objects with named
        Stage sections.
      jobComposition: Job groups Stage sections in its stages map.
      sectionPurpose: Each Stage separates specification, required actions, and
        prohibited actions.
      fixedStageFields: Stage has mandatory spec, Required, and Prohibited fields.
      statementForms: Statement is a literal string or an object with mandatory
        content and ShellCommand.
      normativeSections: Required and Prohibited each contain a named statements map.
    Required:
      statements: {}
    Prohibited:
      statements: {}
  coreOwnershipContextPlacement:
    spec:
      assignedScope: Keep receipt edits within the assigned Cortex context scope.
      subjectLocation: Write subject receipts beside their owning context, outside lace/.
      selfDescription:
        This lace/AGENTS.yaml entry point describes Lace using its own
        vocabulary.
      inertCore: The model and validation implementation contain no operational
        context declarations.
    Required:
      statements: {}
    Prohibited:
      statements: {}
  coreOwnershipCoreChanges:
    spec:
      existingVocabulary: Use the existing core vocabulary and run the existing checks.
      explicitCoreAssignment: Change the core only under an explicit user assignment to change it.
      failedReceiptScope: A receipt that fails validation does not grant that assignment.
      correctReceipt: Correct an invalid receipt using the existing vocabulary.
      missingCapability: Report a missing capability when that vocabulary cannot
        express the assigned context.
    Required:
      statements: {}
    Prohibited:
      statements: {}
  coreOwnershipOwnershipExamples:
    spec: {}
    Required:
      statements:
        requiredUseExistingDeclarations:
          Read the model, then write the assigned receipt
          beside its context using existing declarations.
        requiredUnchangedChecks: Run the unchanged checks.
        requiredSeparateCoreRequest: Report an unsupported capability for a separate core assignment.
    Prohibited:
      statements:
        prohibitedUnauthorizedCoreEdit:
          While assigned to write a context receipt, add a
          model field because the receipt fails validation.
  receiptAuthoringReceiptContract:
    spec:
      importJob:
        Write a YAML document with a root stages map checked against the Lace
        context schema.
      descriptiveNames:
        Follow teams/ai-team/docs/lace-architecture.md#stage-names
        when naming Job stages and short descriptive spec and statement keys.
      modelImports:
        Use the Lace schema vocabulary; command cwd is project-root or
        library-root.
      rootDeclaration: Declare the root stages map with each local Stage inline;
        optionally declare reusable stages and statements in exports.
      explicitStageKeys:
        Give each stage an explicit unique YAML mapping key; write
        local Stage contents inline and use $ref for reusable exported Stages.
      fixedSections:
        Keep context in fixed Stage sections; use source declaration
        order when reading named maps.
      statementPayloads:
        "Use a literal string for prose or { content, ShellCommand: {
        cwd, script } } for a command statement."
    Required:
      statements: {}
    Prohibited:
      statements: {}
  receiptAuthoringReadonlyDeclarations:
    spec:
      stageOrder: Job.stages is a readonly named Stage map after loading; prefer
        nonnumeric names because JavaScript enumerates integer-like object keys
        in ascending order before other string keys.
      readonlyFields:
        Job and Stage fields, statement maps, and structured command
        fields are readonly.
      emptyMaps:
        All stages, spec, and statements maps are literal named objects and
        may be empty.
      literalSections:
        Compose fixed sections with literal named YAML maps and static
        Stage or Statement $ref values; calls and constructors are invalid.
      readonlyAccess:
        The schema checks YAML structure and the loaded Job has readonly
        model types; loading does not freeze JavaScript objects at runtime.
      importConstruction:
        Read declarations as context; loading a receipt constructs
        plain data and never runs declared shell commands.
    Required:
      statements: {}
    Prohibited:
      statements: {}
  receiptAuthoringReadonlyExamples:
    spec: {}
    Required:
      statements:
        requiredTypedReadonly: Keep loaded declaration objects readonly through the Job type.
        requiredStaticComposition:
          Compose Stage and Statement declarations with static
          $ref values and literal YAML maps.
    Prohibited:
      statements:
        prohibitedStageMutation: Mutate receipt sections or hide context behind calls.
  receiptAuthoringStatementShapes:
    spec:
      literalStatementShape:
        Declare prose as a literal string in spec or a Required
        or Prohibited statements map.
      statementMeaning: A statement can explain architecture, describe a
        specification, state a rule, or give an instruction.
      statementRequiredWording: Its wording conveys whether it describes context or requires an action.
      literalStatementText: Use one nonblank YAML string for each prose statement.
      specificationStatements: Declare Stage.spec as a named Statement map for
        specifications and explanatory context.
      shortStatementKeys:
        Give each statement a short descriptive key and nonblank
        YAML string value; keep one independent fact or rule in each statement.
      normativeStatements:
        Put mandatory actions in Required.statements and forbidden
        actions in Prohibited.statements; do not nest Job objects or groups.
      mandatoryStageFields:
        Include spec, Required, and Prohibited in every Stage even
        when their maps are empty.
      purposeNamedSections:
        Use purpose-named Stage sections for related statements;
        follow teams/ai-team/docs/lace-architecture.md#normative-categories for
        their placement.
    Required:
      statements: {}
    Prohibited:
      statements: {}
  receiptAuthoringStatementExamples:
    spec: {}
    Required:
      statements:
        requiredParallelRules: Use named statements for parallel rules.
        requiredSubjectSections: Use separate purpose-named Stages for different subjects.
        requiredExplicitActions: State required actions explicitly in the statement's wording.
    Prohibited:
      statements:
        prohibitedHiddenStructure:
          Hide independent rules in one long paragraph under a
          single statement name.
  receiptAuthoringShellCommands:
    spec:
      shellShape: "Declare a command statement as { content: 'Check receipts.',
        ShellCommand: { cwd: library-root, script: 'bun run check' } }; loaded
        command fields are readonly."
      commandRoots: Choose project-root or library-root for command cwd.
      resolveRoots: Resolve both roots before running commands through the host's shell tool.
      inertCommands: Validation and reference resolution never execute declared commands.
    Required:
      statements: {}
    Prohibited:
      statements: {}
  receiptAuthoringComposition:
    spec:
      declarationGrammar:
        Limit receipts to a root stages map, optional exports with
        both stages and statements maps, literal text and commands, and static
        $ref values. Maps may be empty; sequences, executable logic, unknown
        fields, and nonliteral map shapes are invalid.
      importedContext:
        Reference named Stage and Statement declarations in another
        receipt through its exports to reuse its context.
      readImportedSource: Read the referenced source before applying its context.
      relativeImports: Relative $ref paths resolve from the receipt file.
      literalConditions: Express conditions and context selection in literal statement text.
    Required:
      statements: {}
    Prohibited:
      statements: {}
  receiptAuthoringCompositionExamples:
    spec: {}
    Required:
      statements:
        requiredStaticStages:
          "Declare stages with an inline context Stage containing
          spec: {}, Required: { statements: {} }, and Prohibited: { statements:
          {} }; use { $ref: './compile.lace.yaml#/exports/stages/compileReceipt'
          } and { $ref: './verify.lace.yaml#/exports/stages/verifyReceipt' } for
          reusable Stages."
        requiredAuthoringExample: See
          teams/ai-team/agents/tech-writer/skills/context-engineering/examples/lace/authoring.lace.yaml
          for an authoring example.
        requiredArchitectureReference:
          See teams/ai-team/docs/lace-architecture.md for
          the YAML schema and validation limits.
    Prohibited:
      statements:
        prohibitedInvalidRoot:
          Use a raw sequence or Stage as the root, a constructor,
          or an implementation function.
  validationValidationGuidance:
    spec:
      compilerCheck: Use the schema and reference check while editing receipts.
      completeVerification:
        Run complete verification before reporting that a receipt
        passes all Lace checks.
      libraryRoot: Run these commands from the Cortex library root.
    Required:
      statements: {}
    Prohibited:
      statements: {}
  validationCompile:
    spec: {}
    Required:
      statements:
        compile:
          content: Validate Lace receipt schemas and references.
          ShellCommand:
            cwd: library-root
            script: bun run --filter @meta-cortex/lace check
    Prohibited:
      statements: {}
  validationVerify:
    spec: {}
    Required:
      statements:
        verify:
          content: Verify Lace receipts.
          ShellCommand:
            cwd: library-root
            script: bun run --filter @meta-cortex/lace verify
    Prohibited:
      statements: {}
  validationValidationExamples:
    spec: {}
    Required:
      statements:
        requiredCompileOnly:
          Use check for tooling type checking and YAML schema and
          reference validation without emitting files.
        requiredFullChecks:
          Run verify for formatting, lint, tooling types, YAML schema
          and references, and contract tests.
        requiredCommandEvidence:
          Neither check executes declared commands or proves
          their success in a consuming project.
    Prohibited:
      statements:
        prohibitedIncompleteClaim: Report that all Lace checks pass after running only check.
  scopeRestrictions:
    spec: {}
    Required:
      statements: {}
    Prohibited:
      statements:
        contextOnly: Do not use Lace as a coding-agent API or an application workflow.
        inertModel:
          Do not put subject context declarations in the model or validation
          implementation.
        subjectReceipts:
          Lace's own context entry point is lace/AGENTS.yaml; subject
          receipts belong with their owning context outside lace/.
        protectedCore: Do not change core types, schema, loader, tests, scripts,
          configuration, or the core entry point during receipt authoring.
        explicitAssignment: Core changes require an explicit user assignment to change the core.
  scopeExamples:
    spec: {}
    Required:
      statements:
        requiredAssignedFiles: Keep receipt work within the assigned Cortex context files.
        requiredAuthorizedCoreWork:
          When explicitly assigned to change Lace, edit the
          relevant core files and verify the project.
    Prohibited:
      statements:
        prohibitedWeakenCore:
          Add an application callback to the model or weaken lint to
          make a context receipt pass.
