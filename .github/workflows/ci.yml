name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: app
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up compiler cache
        uses: ./.github/actions/rust-sccache
        with:
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          access-key: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
      - run: cargo fmt --all --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Set up compiler cache
        uses: ./.github/actions/rust-sccache
        with:
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          access-key: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target/llvm-cov-target
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --workspace --fail-under-lines 90

  skill-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - name: Verify framework and skill scripts
        run: |
          cd cortex
          bun install --frozen-lockfile --ignore-scripts
          test -z "$(find scripts teams -name node_modules -print -quit)"
          test -z "$(find scripts teams -name bun.lock -print -quit)"
          bun run verify
          bun run docs:check
