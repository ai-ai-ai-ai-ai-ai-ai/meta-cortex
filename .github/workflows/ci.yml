name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: app
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up compiler cache
        uses: ./.github/actions/rust-sccache
        with:
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          access-key: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
      - run: cargo fmt --all --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Install the native Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo install --locked --path installer --root "$env:RUNNER_TEMP\meta cortex installed"
      - name: Verify native Windows installation and durable ledger
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\windows-e2e.ps1" -Binary "$env:RUNNER_TEMP\meta cortex installed\bin\meta-cortex.exe"
      - name: Retain native Windows E2E evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-e2e
          path: ${{ runner.temp }}/meta cortex Windows E2E/evidence
          if-no-files-found: ignore
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Set up compiler cache
        uses: ./.github/actions/rust-sccache
        with:
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          access-key: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target/llvm-cov-target
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --workspace --fail-under-lines 90

  skill-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - name: Verify framework and skill scripts
        run: |
          cd cortex
          bun install --frozen-lockfile --ignore-scripts
          test -z "$(find lace scripts teams -name node_modules -print -quit)"
          test -z "$(find lace scripts teams -name bun.lock -print -quit)"
          bun run verify
          bun run docs:check
