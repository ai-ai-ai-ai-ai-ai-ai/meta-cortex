name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: app
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up compiler cache
        uses: ./.github/actions/rust-sccache
        with:
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          access-key: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
      # Temporary focused draft measurement; restore all gates before delivery.
      - name: Measure the representative installation fixture
        shell: pwsh
        run: |
          Remove-Item Env:BUN_INSTALL_CACHE_DIR -ErrorAction SilentlyContinue
          $env:RUSTC_WRAPPER = ''
          cargo test --locked -p meta-cortex installation::tests::preserves_root_workspace_dependencies -- --exact --nocapture --test-threads=1
