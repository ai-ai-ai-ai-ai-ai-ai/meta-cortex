name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: app
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Configure Windows native check profile
        if: runner.os == 'Windows'
        shell: pwsh
        # Retain dev assertions and overflow checks while avoiding full debug symbols.
        run: '"CARGO_PROFILE_DEV_DEBUG=0" >> $env:GITHUB_ENV'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Verify desktop frontend
        if: runner.os != 'Windows'
        working-directory: app/visualization/frontend
        run: |
          bun install --frozen-lockfile
          bun run verify
          bun run test
      - name: Install Windows desktop frontend dependencies
        if: runner.os == 'Windows'
        working-directory: app/visualization/frontend
        run: bun install --frozen-lockfile
      - name: Build embedded desktop frontend
        if: runner.os != 'Windows'
        working-directory: app/visualization/frontend
        # Windows Cargo builds generate these assets through visualization/build.rs.
        run: bun run build
      - name: Set up compiler cache
        uses: ./.github/actions/rust-sccache
        with:
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          access-key: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
          shared-key: rust
      - run: cargo fmt --all --check
      - run: cargo check --locked --workspace --all-targets ${{ runner.os == 'Windows' && '--timings' || '' }}
      - run: cargo clippy --locked --workspace --all-targets ${{ runner.os == 'Windows' && '--timings' || '' }} -- -D warnings
      - run: cargo test --locked --workspace
        if: runner.os != 'Windows'
      - name: Install the native Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        # Exercise Cargo installation using the dev profile shared with workspace tests.
        # The Release workflow separately builds and verifies the optimized Windows archive.
        run: cargo install --profile dev --timings --locked --path installer --root "$env:RUNNER_TEMP\meta cortex installed"
      - name: Verify native Windows installation and durable ledger
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\windows-e2e.ps1" -Binary "$env:RUNNER_TEMP\meta cortex installed\bin\meta-cortex.exe"
      - name: Verify the published Scoop package
        if: runner.os == 'Windows' && hashFiles('bucket/meta-cortex.json') != ''
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\scoop-e2e.ps1"
      - name: Verify the published Homebrew package
        if: runner.os == 'macOS' && hashFiles('bucket/meta-cortex.json') != ''
        run: |
          brew tap ai-ai-ai-ai-ai-ai-ai/tap
          brew install ai-ai-ai-ai-ai-ai-ai/tap/meta-cortex
          binary="$(brew --prefix meta-cortex)/bin/meta-cortex"
          expected="$(python3 -c 'import json; print(json.load(open("../bucket/meta-cortex.json"))["version"])')"
          test "$("$binary" --version)" = "meta-cortex $expected"
          export META_CORTEX_HOME="$RUNNER_TEMP/Homebrew managed home"
          "$binary" list
      - name: Retain native Windows E2E evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-e2e
          path: ${{ runner.temp }}/meta cortex Windows E2E/evidence
          if-no-files-found: ignore
      - name: Retain native Windows Cargo timings
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-install-cargo-timings
          path: app/target/cargo-timings/*.html
          if-no-files-found: ignore
  windows-frontend:
    name: Windows frontend checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - name: Verify and test desktop frontend
        working-directory: app/visualization/frontend
        run: |
          bun install --frozen-lockfile
          bun run verify
          bun run test
  windows-tests:
    name: Windows workspace tests
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop frontend dependencies
        working-directory: app/visualization/frontend
        run: bun install --frozen-lockfile
      - name: Set up compiler cache
        uses: ./.github/actions/rust-sccache
        with:
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          access-key: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
          shared-key: rust
      - name: Run the native Windows workspace tests
        # Keep fixture projects and their private tool caches on the workspace drive.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --locked --workspace --no-fail-fast --timings
      - name: Retain native Windows Cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-test-cargo-timings
          path: app/target/cargo-timings/*.html
          if-no-files-found: ignore
  windows:
    name: Windows checks
    needs: [rust, windows-frontend, windows-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all check jobs to succeed
        working-directory: .
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          FRONTEND_RESULT: ${{ needs.windows-frontend.result }}
          TEST_RESULT: ${{ needs.windows-tests.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$TEST_RESULT" = success
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build embedded desktop frontend
        working-directory: app/visualization/frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Set up compiler cache
        uses: ./.github/actions/rust-sccache
        with:
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          access-key: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target/llvm-cov-target
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --workspace --fail-under-lines 90

  skill-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          working_directory: cortex
      - name: Verify framework and skill scripts
        run: |
          cd cortex
          bun install --frozen-lockfile --ignore-scripts
          test -z "$(find lace scripts teams -name node_modules -print -quit)"
          test -z "$(find lace scripts teams -name bun.lock -print -quit)"
          bun run verify
          bun run docs:check
